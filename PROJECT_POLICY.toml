version = 1

[structure]
max_source_lines = 800

source_extensions = [
    ".gml",
    ".vsh",
    ".fsh",
    ".py",
    ".sh",
    ".js",
    ".jsx",
    ".ts",
    ".tsx",
    ".cs",
]

forbidden_generic_stems = [
    "helper",
    "helpers",
    "util",
    "utils",
    "misc",
    "common",
]

[assets]
source_root = "assets/source"
runtime_root = "assets/runtime"
manifest = "assets/exports.json"
content_root = "content"
plain_runtime_svg = true

[imports.gmtl]
lock = "project/gmtl.lock.json"

[assets.pipelines.vector]
source_extensions = [".svg"]
runtime_extensions = [".svg"]

[assets.pipelines.ui]
source_extensions = [".svg", ".png"]
runtime_extensions = [".png"]

[assets.pipelines.raster]
source_extensions = [".kra"]
runtime_extensions = [".png"]

[assets.pipelines.music]
source_extensions = [".mid", ".logicx"]
runtime_extensions = [".flac"]
sample_rate = 48000
channels = 2

[assets.pipelines.sound_effect]
source_extensions = [".logicx"]
runtime_extensions = [".wav"]
sample_rate = 48000
channels = 2

[assets.pipelines.model_3d]
source_extensions = [".blend", ".obj", ".mtl"]
runtime_extensions = [".vbuff"]

[risk]
max_changed_files = 100
max_changed_lines = 10000

high_risk_paths = [
    ".github/actions/**",
    ".github/rulesets/**",
    ".github/workflows/**",
    ".agents/skills/**",
    ".gitattributes",
    "AGENTS.md",
    "GOVERNANCE.md",
    "PROJECT_POLICY.toml",
    "docs/SETUP.md",
    "templates/codex/**",
    "tools/assets/**",
    "tools/ci/**",
    "tools/setup_github.py",
    "project/gmtl.lock.json",
]
